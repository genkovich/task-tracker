server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html is the prerendered "/" (login) page; hydrating it against any
    # other route throws React #418. Non-prerendered routes must fall back to
    # the neutral SPA shell react-router emits for exactly this purpose.
    location / {
        try_files $uri $uri/ /__spa-fallback.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
