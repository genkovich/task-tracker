# Прод-стек на VPS. Живе в /opt/task-tracker разом із .env (секрети — тільки там).
# Образи збирає GitHub Actions і пушить у GHCR; деплой = pull + migrate + up.
services:
  caddy:
    image: caddy:2.11-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # battery:observability
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN}
      # /battery:observability
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - caddy-config:/config
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    image: ghcr.io/genkovich/task-tracker/api:${IMAGE_TAG:-latest}
    command: ["/bin/task-tracker-migrate", "-direction=up"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/genkovich/task-tracker/api:${IMAGE_TAG:-latest}
    environment:
      PORT: "8080"
      APP_ENV: production
      LOG_LEVEL: info
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: https://${DOMAIN}/api/v1/auth/google/callback
      FRONTEND_URL: https://${DOMAIN}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/files:/var/www/files
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # battery:web
  web:
    image: ghcr.io/genkovich/task-tracker/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
  # /battery:web

  # battery:observability
  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
  # /battery:observability

volumes:
  caddy-config:
  # battery:observability
  prom-data:
  grafana-data:
  # /battery:observability
