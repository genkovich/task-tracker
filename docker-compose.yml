# Task Tracker — локальний повний стек. Дев-цикл іде повз compose
# (make -C api run + npm run dev) — цей стек показує, що проєкт живий цілком.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: task-tracker
      POSTGRES_PASSWORD: task-tracker
      POSTGRES_DB: task-tracker
      # postgres:18 changed the data layout; pin PGDATA to a subdir of the mounted volume
      # so the image stops crash-looping on the legacy /var/lib/postgresql/data mount.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task-tracker"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    build: ./api
    env_file: api/.env
    environment:
      # у compose-мережі БД живе на хості postgres — override поверх api/.env
      DATABASE_URL: postgres://task-tracker:task-tracker@postgres:5432/task-tracker?sslmode=disable
    command: ["/bin/task-tracker-migrate", "-direction=up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./api
    env_file: api/.env
    environment:
      DATABASE_URL: postgres://task-tracker:task-tracker@postgres:5432/task-tracker?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # battery:web
  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
  # /battery:web

  # battery:observability
  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
  # /battery:observability

volumes:
  pgdata:
  # battery:observability
  grafana-data:
  # /battery:observability
