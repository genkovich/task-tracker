# api CI — copy to .github/workflows/ci.yml (repo root).
#
# Runs the repo's REAL make targets so local and CI behaviour stay identical:
#   make vet  ·  make lint  ·  make test  ·  make test-integration  ·  govulncheck
#
# The Go module lives in the api/ subdirectory of this monorepo (the repo
# root also holds web/, a React/TS app — out of scope here). Every job
# therefore sets `working-directory: api` and caches against
# api/go.sum, and the path filter scopes runs to backend changes.
#
# Action versions below are pinned to a major; bump deliberately (Dependabot
# `github-actions` keeps them current — see dependabot.yml).

name: CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: api

env:
  GO_VERSION: "1.25"

jobs:
  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      - name: go mod verify
        run: go mod verify
      - name: Check go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: make vet
        run: make vet

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      # golangci-lint-action manages its own cache; it reads .golangci.yml from
      # the working directory (provided by the go-lint skill).
      - name: make lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: api
          args: --timeout 5m

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      - name: Build
        run: go build ./...
      # `make test` is `go test ./...`; add -race -shuffle=on -coverprofile in CI
      # to catch data races and inter-test coupling that the bare target doesn't.
      - name: Run unit tests (race + shuffle + coverage)
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: api/coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # testcontainers-go starts postgres:18-alpine in a throwaway container; Redis is
    # faked in-process with miniredis. ubuntu-latest ships a working Docker daemon,
    # which testcontainers needs — no `services:` block required. The tests self-skip
    # (t.Skip) when Docker is unavailable, so this job is safe even on a runner without it.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      # `make test-integration` is `go test -tags integration -p 4 ./...`; add
      # -count=1 so cached results can't mask flaky service interactions.
      - name: make test-integration
        run: go test -tags integration -p 4 -count=1 ./...

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      - name: govulncheck ./...
        uses: golang/govulncheck-action@v1
        with:
          work-dir: api
